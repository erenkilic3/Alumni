version: '3.8'

services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: alumni_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-alumni_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-alumni_secure_password}
      POSTGRES_DB: ${DB_NAME:-alumni_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-alumni_admin} -d ${DB_NAME:-alumni_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Node.js Backend API Service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: alumni_backend_api
    restart: always
    environment:
      PORT: 5001
      NODE_ENV: development
      DATABASE_URL: postgresql://${DB_USER:-alumni_admin}:${DB_PASSWORD:-alumni_secure_password}@db:5432/${DB_NAME:-alumni_db}?schema=public
      CLIENT_URL: http://localhost:3000
    ports:
      - "5001:5001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules

  # 3. Frontend Web Application Service
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: alumni_frontend_app
    restart: always
    environment:
      PORT: 3000
      VITE_API_URL: http://localhost:5000/api
    ports:
      - "3000:3000"
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules

volumes:
  pgdata:
    driver: local
